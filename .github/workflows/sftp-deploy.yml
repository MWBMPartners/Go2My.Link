# =============================================================================
# Go2My.Link — SFTP Deploy Workflow
# =============================================================================
#
# After the code checks pass, uploads web/ to Dreamhost over SFTP. The upload
# itself is scripts/sftp-deploy.sh. The owner's set-up steps, the dry run and
# how to arm and disarm are in docs/DEPLOYMENT.md.
#
# WHERE EACH BRANCH GOES (#158)
#   secrets.SFTP_BASE_PATH is a folder used only by this service
#   (docs/decisions/D-007-deploy-separate-folder.md). Each channel has its own
#   complete copy of web/ inside it (D-019-test-sites-own-copy.md):
#
#     main              ->  <service folder>/live/    (the only live upload)
#     alpha             ->  <service folder>/alpha/
#     beta              ->  <service folder>/beta/
#     release-candidate ->  <service folder>/rc/      (manual run only)
#
#   Any other branch or tag is refused. No channel reads or writes another
#   channel's program files. (The test copies share the live database: D-029.)
#   release-candidate is deliberately not in the push list below; to upload it,
#   use "Run workflow" on that branch (D-032).
#
# SAFETY
#   * Each real upload writes <copy>/.g2ml-channel; only a copy marked live
#     runs timed jobs and clean-ups.
#   * The server's identity is pinned (secrets.SFTP_KNOWN_HOSTS). A missing or
#     wrong entry stops the run.
#   * The run stops unless the service folder holds the marker file
#     .g2ml-service-folder.
#   * Server files are removed only inside the folders listed in the script, and
#     credentials, uploads, logs, backups and install lock files are never
#     uploaded or removed.
#   * A manual run is a dry run unless the dry_run box is unticked. A push to
#     main, alpha or beta uploads for real.
#   * Nothing happens at all unless vars.SFTP_ENABLED is 'true'.
#
# SECRETS live in the GitHub Environment "sftp-deploy" (repo -> Settings ->
# Environments), which allows only the branches main, alpha, beta and
# release-candidate. They must NOT also exist as repository secrets: an older copy of this file, on any
# branch or tag, would be able to use those, with no server identity check.
#   SFTP_HOST         Dreamhost SFTP server name
#   SFTP_USER         SFTP username
#   SFTP_PORT         SFTP port (optional; 22 if unset or blank)
#   SFTP_BASE_PATH    The folder used only by this service
#   SFTP_KNOWN_HOSTS  The server's pinned host key line(s)
#   SFTP_KEY          SSH private key (preferred)
#   SFTP_PASSWORD     SFTP password (used only when SFTP_KEY is empty)
#   MAXMIND_LICENSE_KEY  (optional; stays an organisation or repository secret)
#                     MaxMind GeoLite2 licence key (#43). When
#                     set, scripts/fetch-geoip.sh downloads the country database
#                     before the upload. When unset or the download fails, the
#                     deploy carries on and any database already on the server
#                     is left as it is. Turning the feature on is a separate
#                     setting; see web/_sql/seeds/017_geolocation_settings.sql.
#
# VARIABLES (repo -> Settings -> Secrets and variables -> Actions -> Variables)
#   SFTP_ENABLED      'true' arms deployment (off by default). It must be a
#                     repository variable: the job's "if:" is read before the
#                     environment is.
#
# RUNNER: both jobs run on `ubuntu-latest` (house rule, see
# .claude/memory/patterns.md -> "CI/CD & GitHub Actions").
#
# @package    Go2My.Link
# @author     MWBM Partners Ltd (MWservices)
# @since      v1.0.0 — Launch Hardening (GeoIP fetch added v1.1.0 / #43)
# =============================================================================

name: SFTP Deploy

on:
  push:
    branches:
      - main
      - alpha
      - beta
    paths:
      - 'web/**'
      - '.github/workflows/sftp-deploy.yml'
      - 'scripts/sftp-deploy.sh'
      - 'scripts/fetch-geoip.sh'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview lftp actions, upload nothing)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# One deploy per branch at a time; never cancel an in-flight mirror (a
# half-cancelled mirror could leave the remote in a partial state).
concurrency:
  group: sftp-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Gate — the same must-pass code checks that gate main, re-run here so NO
  # deploy (on any branch) proceeds unless PHP/JS/JSON are syntactically valid
  # and the unit tests pass.
  #
  # The PHP checks run once for each supported PHP version in the list below
  # (the lowest we support, 8.4, and 8.5). PHP 8.6 is NOT in the list while it
  # is still advisory in ci.yml: an advisory check must never stop a deploy.
  # When 8.6 is promoted in ci.yml, add '8.6' to this list in the same change.
  #
  # The deploy job below uses `needs: checks` and its `if:` does not name a
  # status function, so GitHub adds `success()` itself. That means every leg
  # of this matrix must pass: one failed leg stops the deploy.
  #
  # The unit tests need no database and no secrets. They look up two public
  # host names (see tests/README.md); that works on GitHub's runners.
  # ===========================================================================
  checks:
    name: Pre-deploy checks (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, mysqli
          tools: parallel-lint

      - name: PHP syntax lint
        run: |
          parallel-lint --exclude vendor --exclude _libraries --exclude .git web/

      - name: PHP strict lint
        run: |
          sh scripts/php-lint.sh

      - name: PHP unit tests
        run: |
          php tests/run.php

      # The JavaScript and JSON checks do not depend on the PHP version, so
      # they run on the 8.4 leg only.
      - name: Setup Node.js
        if: matrix.php-version == '8.4'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          # Node 24 (long-term support). 24.22.1 is the first 24.x release that
          # fixes CVE-2026-111497 in Node's built-in Brotli decoder (#302). Node 20
          # is past end of life and gets no fix. check-latest makes setup-node
          # fetch the newest 24.x instead of reusing an older copy already cached
          # on the runner, which could predate the fix.
          node-version: '24'
          check-latest: true

      - name: JavaScript syntax + JSON validity
        if: matrix.php-version == '8.4'
        run: |
          set -euo pipefail
          while IFS= read -r file
          do
            node --check "$file"
          done < <(git ls-files 'web/**/*.js' | grep -vE '_libraries/|/vendor/|\.min\.js$' || true)
          while IFS= read -r file
          do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"
          done < <(git ls-files 'web/**/*.json' | grep -vE '_libraries/|/vendor/|package-lock' || true)

  # ===========================================================================
  # Deploy — armed only when the SFTP_ENABLED variable is 'true'.
  # ===========================================================================
  deploy:
    name: Deploy via SFTP
    runs-on: ubuntu-latest
    needs: checks
    if: vars.SFTP_ENABLED == 'true'
    # The SFTP secrets belong to this environment, and GitHub gives them only to
    # the branches the environment allows (docs/DEPLOYMENT.md, owner set-up).
    environment: sftp-deploy
    # Hard cap so a stalled SFTP mirror can't hang near the 6h Actions ceiling.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # GeoIP database fetch (#43). It never fails the job: with no licence key,
      # or a failed download, it writes nothing, the upload script sends no
      # database, and any database already on the server stays as it is.
      - name: Fetch GeoLite2-Country GeoIP database (#43)
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          bash scripts/fetch-geoip.sh

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # All the checks and the upload are in the script, so that they can be
      # run and tested outside GitHub. Values reach it as environment
      # variables only, never pasted into the command text.
      - name: Deploy
        id: deploy
        env:
          DEPLOY_REF: ${{ github.ref }}
          DEPLOY_EVENT: ${{ github.event_name }}
          DEPLOY_DRY_INPUT: ${{ github.event.inputs.dry_run }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_BASE_PATH: ${{ secrets.SFTP_BASE_PATH }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: bash scripts/sftp-deploy.sh

      - name: Deploy summary
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
          CHANNEL: ${{ steps.deploy.outputs.channel }}
          METHOD: ${{ steps.deploy.outputs.auth }}
          DRY: ${{ steps.deploy.outputs.dry }}
          RESULT: ${{ steps.deploy.outcome }}
        run: |
          {
            echo "## SFTP Deploy"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Branch | ${BRANCH} |"
            echo "| Copy on the server | ${CHANNEL} |"
            echo "| Sign-in method | ${METHOD} |"
            echo "| Dry run | ${DRY} |"
            echo "| Result | ${RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"
