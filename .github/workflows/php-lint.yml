# =============================================================================
# Go2My.Link — PHP Lint Workflow
# =============================================================================
#
# Runs PHP syntax validation on all .php files when code is pushed or a
# pull request is opened. Catches syntax errors before they reach production.
#
# @package    Go2My.Link
# @author     MWBM Partners Ltd (MWservices)
# @since      Phase 0
# =============================================================================

name: PHP Lint

on:
  push:
    branches: [ main ]
    paths:
      - '**.php'
  pull_request:
    branches: [ main ]
    paths:
      - '**.php'

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          tools: parallel-lint

      - name: Run PHP Lint
        run: |
          parallel-lint --exclude vendor --exclude _libraries --exclude .git web/

      - name: Install PHPStan
        env:
          PHPSTAN_VERSION: "2.2.4"
          PHPSTAN_SHA256: "f1e81a1418faab14a057188646cf1220f066276fc640ce9ef1c9a4af3f0ed46b"
        run: |
          curl -sL "https://github.com/phpstan/phpstan/releases/download/${PHPSTAN_VERSION}/phpstan.phar" -o phpstan.phar
          echo "${PHPSTAN_SHA256}  phpstan.phar" | sha256sum --check --strict
          chmod +x phpstan.phar

      - name: Run PHPStan (advisory)
        run: php phpstan.phar analyse --configuration=phpstan.neon --no-progress
        continue-on-error: true

      - name: Install PHP_CodeSniffer
        env:
          PHPCS_VERSION: "3.7.2"
          PHPCS_SHA256: "204214c1ea5ba814fb0b2608c19cca2c10bf5ffcc9f0e3d4c34aadc0179517b7"
        run: |
          curl -sL "https://github.com/squizlabs/PHP_CodeSniffer/releases/download/${PHPCS_VERSION}/phpcs.phar" -o phpcs.phar
          echo "${PHPCS_SHA256}  phpcs.phar" | sha256sum --check --strict
          chmod +x phpcs.phar

      - name: Run PHPCS (advisory)
        run: php phpcs.phar --standard=phpcs.xml --report=summary
        continue-on-error: true
