# =============================================================================
# Go2My.Link — CI (Frontend + Backend code checks)
# =============================================================================
#
# Runs the front-end (JS / JSON / CSS) and back-end (PHP) code checks that
# gate every pull request and every push to a deployable branch. The two job
# names below are deliberately fixed:
#
#     Frontend (ubuntu-latest)
#     Backend (ubuntu-latest)
#
# These are the exact status-check contexts required by the repository's
# "Protect main branch" ruleset. The `os` matrix (single value) is what makes
# GitHub render the "(ubuntu-latest)" suffix into the check context name, so
# the required checks resolve instead of orphaning. Do not rename these jobs
# or drop the matrix without also updating the ruleset, or every PR to main
# will soft-lock.
#
# Must-pass steps are syntax-level checks (JS parse, JSON validity, PHP lint)
# plus PHPStan (level 5), all known-green on the current tree (#76). Style /
# code-sniffer steps still run advisory (continue-on-error) so they surface
# issues without blocking the gate; PHP_CodeSniffer can be promoted to a hard
# failure once the tree is clean (tracked as a #76 follow-up).
#
# @package    Go2My.Link
# @author     MWBM Partners Ltd (MWservices)
# @since      v1.0.0 — Launch Hardening
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
      - alpha
      - beta
      - release-candidate
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Frontend — JavaScript syntax, JSON validity, CSS sanity
  # Emits the required status check: "Frontend (ubuntu-latest)"
  # ===========================================================================
  frontend:
    name: Frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'

      - name: JavaScript syntax check
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file
          do
            count=$((count + 1))
            echo "Checking $file"
            node --check "$file"
          done < <(git ls-files 'web/**/*.js' | grep -vE '_libraries/|/vendor/|\.min\.js$' || true)
          echo "Checked $count JavaScript file(s)."

      - name: JSON validity check
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file
          do
            count=$((count + 1))
            echo "Validating $file"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"
          done < <(git ls-files 'web/**/*.json' | grep -vE '_libraries/|/vendor/|package-lock' || true)
          echo "Validated $count JSON file(s)."

      - name: CSS lint (advisory)
        continue-on-error: true
        run: |
          set -uo pipefail
          npx --yes stylelint --version >/dev/null 2>&1 || true
          npx --yes stylelint "web/**/*.css" \
            --ignore-pattern "**/_libraries/**" \
            --ignore-pattern "**/vendor/**" \
            --ignore-pattern "**/*.min.css" \
            --config '{"rules":{}}' || true

  # ===========================================================================
  # Backend — PHP syntax lint + PHPStan (hard gates) + PHP_CodeSniffer (advisory)
  # Emits the required status check: "Backend (ubuntu-latest)"
  # ===========================================================================
  backend:
    name: Backend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
        with:
          php-version: '8.4'
          tools: parallel-lint

      - name: PHP syntax lint
        run: |
          parallel-lint --exclude vendor --exclude _libraries --exclude .git web/

      - name: PHPStan
        continue-on-error: false
        env:
          PHPSTAN_VERSION: "2.2.4"
          PHPSTAN_SHA256: "f1e81a1418faab14a057188646cf1220f066276fc640ce9ef1c9a4af3f0ed46b"
        run: |
          curl -sL "https://github.com/phpstan/phpstan/releases/download/${PHPSTAN_VERSION}/phpstan.phar" -o phpstan.phar
          echo "${PHPSTAN_SHA256}  phpstan.phar" | sha256sum --check --strict
          chmod +x phpstan.phar
          php phpstan.phar analyse --configuration=phpstan.neon --no-progress

      - name: PHP unit tests
        continue-on-error: false
        run: |
          php tests/run.php

      - name: PHP_CodeSniffer (advisory)
        continue-on-error: true
        env:
          PHPCS_VERSION: "3.7.2"
          PHPCS_SHA256: "204214c1ea5ba814fb0b2608c19cca2c10bf5ffcc9f0e3d4c34aadc0179517b7"
        run: |
          curl -sL "https://github.com/squizlabs/PHP_CodeSniffer/releases/download/${PHPCS_VERSION}/phpcs.phar" -o phpcs.phar
          echo "${PHPCS_SHA256}  phpcs.phar" | sha256sum --check --strict
          chmod +x phpcs.phar
          php phpcs.phar --standard=phpcs.xml --report=summary

  # ===========================================================================
  # Tests (Integration) — mysql:8 service container.
  #
  # tests/integration/*.php need a database seeded exactly the way a FRESH
  # install is documented to be seeded (docs/INSTALL.md's "Manual / fallback
  # setup" section, empirically re-verified in docs/SCHEMA_REVIEW_2026-06-04.md
  # on a throwaway MySQL 9.6 instance): import web/_sql/schema/*.sql, then
  # web/_sql/procedures/*.sql, then web/_sql/seeds/*.sql, in that order.
  #
  # web/_sql/migrations/*.sql is DELIBERATELY NOT imported here: migrations
  # 001-004/006-009 replay one-off legacy data out of the old mwtools_mwlink
  # database, which does not exist in this throwaway container, and would
  # error out; the remaining migrations (010-019) are idempotent fixups for
  # an ALREADY-DEPLOYED schema that a same-day fresh import does not need
  # (e.g. migration 014's own docblock: "FRESH INSTALLS DO NOT NEED THIS FILE
  # — already part of the base schema").
  #
  # 🔤 #196 — the mysql image's own "create me a database on startup"
  # environment setting is DELIBERATELY not given to the service container
  # below. Setting it used to make the container create the database itself,
  # using the SERVER's own default collation (utf8mb4_0900_ai_ci) — before
  # our own web/_sql/schema/000_create_database.sql ever got to run. That
  # file's CREATE DATABASE says IF NOT EXISTS, so it found the database
  # already there and did nothing, and the COLLATE utf8mb4_unicode_ci it asks
  # for was silently thrown away. A stored procedure's local variables take
  # their collation from the DATABASE, not from the table they are compared
  # against, so every such comparison in sp_generateShortCode/sp_lookupShortURL
  # then failed with "illegal mix of collations" — an error
  # sp_generateShortCode's own handler swallowed (before #197), so what
  # actually showed up was 25 tests failing with no clue why. Leaving that
  # setting out lets our own schema file create the database with the
  # collation it actually asks for. The "Check database collation" step
  # below proves that held, rather than trusting it silently.
  #
  # This job, and the "PHP integration tests" step inside it, are no longer
  # continue-on-error — this is a real gate now, not an advisory one. Making
  # the check "Tests (Integration) (ubuntu-latest)" itself REQUIRED on the
  # "Protect main branch" ruleset is a separate GitHub setting only the owner
  # can change — see docs/DEPLOYMENT.md, "Making the integration tests a
  # required check (owner action)".
  # ===========================================================================
  tests-integration:
    name: Tests (Integration)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    # #183 follow-up: a MariaDB (mariadb:11) matrix leg was attempted here so
    # schema-portability against Dreamhost's production engine would be caught
    # in CI. It could NOT be kept on this runner: the MariaDB service container
    # reaches "ready for connections" but the sandbox-restricted runner (note
    # the `io_uring ... EPERM` in its log) tears it down and reports "failed to
    # initialize container", regardless of the health command tried
    # (mysqladmin/mariadb-admin, with and without credentials). GitHub-hosted
    # runners orchestrate it fine; this environment does not.
    #
    # #186's CAST(... AS DATETIME) fix, mentioned in an earlier version of this
    # comment as having settled the schema-portability question, turned out
    # NOT to: the MariaDB leg above was reverted before it ever actually
    # exercised that CAST against a real MariaDB, so the fix went unverified
    # until #183 was re-checked by hand on 2026-09-21 and the CAST was found
    # to still fail on MariaDB 11.4 (ERROR 1901). The working fix — a plain
    # TIMESTAMP literal instead of a CAST — is in
    # web/_sql/schema/036_pricing_engine.sql + migrations/020 (see the comment
    # above effectiveFromKey there for the full story), and this job still
    # only proves it against mysql:8. MariaDB coverage now lives in its own
    # workflow instead of a second leg of this job's `services:` container:
    # .github/workflows/mariadb-import.yml starts MariaDB with a plain
    # `docker run` step, which sidesteps the `services:` container health-check
    # machinery that failed here, rather than trying again to fix that
    # machinery. Before a production cutover, still validate the schema
    # against the actual Dreamhost database — that workflow proves MariaDB
    # 11.4 in general, not whatever exact point release Dreamhost runs.
    services:
      mysql:
        image: "mysql:8"
        env:
          MYSQL_ROOT_PASSWORD: "g2ml_ci_root_password"
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
        with:
          php-version: "8.4"
          extensions: "mysqli"

      - name: Import schema + procedures + seeds (fresh-install order, see docs/INSTALL.md)
        env:
          MYSQL_PWD: "g2ml_ci_root_password"
        run: |
          set -euo pipefail
          for sqlFile in $(find "web/_sql/schema" -maxdepth 1 -name "*.sql" | sort)
          do
            echo "Importing ${sqlFile}"
            mysql --host="127.0.0.1" --port="3306" --user="root" < "${sqlFile}"
          done
          for sqlFile in $(find "web/_sql/procedures" -maxdepth 1 -name "*.sql" | sort)
          do
            echo "Importing ${sqlFile}"
            mysql --host="127.0.0.1" --port="3306" --user="root" < "${sqlFile}"
          done
          for sqlFile in $(find "web/_sql/seeds" -maxdepth 1 -name "*.sql" | sort)
          do
            echo "Importing ${sqlFile}"
            mysql --host="127.0.0.1" --port="3306" --user="root" < "${sqlFile}"
          done

      # 🔤 #196 — proves the fix above actually held, rather than trusting it
      # silently: fails the build the moment the database's own collation is
      # anything other than what the stored procedures depend on.
      - name: Check database collation
        env:
          MYSQL_PWD: "g2ml_ci_root_password"
        run: |
          set -euo pipefail
          collation=$(mysql --host="127.0.0.1" --port="3306" --user="root" \
            --skip-column-names --batch \
            --execute="SELECT DEFAULT_COLLATION_NAME FROM information_schema.SCHEMATA WHERE SCHEMA_NAME = 'mwtools_Go2MyLink'")
          echo "Database collation: ${collation}"
          if [ "${collation}" != "utf8mb4_unicode_ci" ]
          then
            echo "Expected utf8mb4_unicode_ci, got '${collation}' — see #196."
            exit 1
          fi

      - name: PHP integration tests
        env:
          G2ML_TEST_DB_HOST: "127.0.0.1"
          G2ML_TEST_DB_PORT: "3306"
          G2ML_TEST_DB_NAME: "mwtools_Go2MyLink"
          G2ML_TEST_DB_USER: "root"
          G2ML_TEST_DB_PASS: "g2ml_ci_root_password"
        run: |
          php tests/run_integration.php
