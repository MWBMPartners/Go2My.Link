<!DOCTYPE html>
<!--
    Copyright (c) 2024–2026 MWBM Partners Ltd (MWservices).
    All rights reserved.

    Shown by the lnks.page service worker (sw.js) when the server cannot be
    reached (#213). Nothing on the site links to it. It runs no script and loads
    nothing else.

    It is English only. The main site translates its offline page by having PHP
    print it at /offline before the worker stores it. Doing the same here would
    mean taking the address /offline away from any LinksPage with that name, and
    a page with its own styles, because the shared one uses /css/style.css,
    which lnks.page does not have. A LinksPage name cannot contain a dot, so
    /offline.html takes no name away.
-->
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Lnks.page cannot be reached without an internet connection.">
    <title>You are offline — Lnks.page</title>
    <style type="text/css">
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            color: #212529;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        main {
            padding: 1.5rem;
        }
        a {
            color: #0a58ca;
        }
        a:focus-visible {
            outline: 3px solid currentColor;
            outline-offset: 3px;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0a0e14;
                color: #e9ecef;
            }
            a {
                color: #8ab4f8;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>You are offline</h1>
        <p>Check your connection and try again.</p>
        <p><a href="/">Try again</a></p>
    </main>
</body>
</html>
