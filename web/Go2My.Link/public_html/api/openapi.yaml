openapi: "3.1.0"
info:
  title: Go2My.Link Public API
  version: "1.0.0"
  summary: Versioned public API for the Go2My.Link URL-shortening platform.
  description: |
    The `/api/v1/*` public API lets an authenticated organisation create,
    read, update and soft-delete short URLs, read its own account and
    organisation summary, and (for partners with the CueRCode dynamic-QR
    integration enabled) link a short URL to an externally-managed QR code.

    This document is generated directly from the shipped PHP implementation
    (`web/Go2My.Link/public_html/api/v1/index.php` and its `handlers/*.php`,
    `web/_functions/api_auth.php`, `web/_functions/api_response.php`,
    `web/_functions/api_ratelimit.php`) — every field, status code and
    validation rule below reflects what the code actually does, not an
    aspirational design.

    ### Request pipeline

    Every request passes through the same ordered pipeline before a handler
    ever runs. Each step's failure short-circuits to a response (and is still
    logged to the audit trail regardless of outcome):

    1. HTTPS enforcement (`403` if not secure, non-local environments only).
    2. Route sanitisation (an unrecognised or malformed route is treated as
       `404`, never as a different error).
    3. The `api.public_enabled` master switch (`503` when the operator has
       disabled the public API entirely).
    4. Pre-authentication IP failed-auth backoff (`429` — see "Rate limiting
       and backoff" below).
    5. Bearer / `X-API-Key` extraction (`401` when neither header carries a
       key).
    6. Key verification (`401` when the key is invalid, expired, revoked,
       suspended, or its owning user/organisation is inactive).
    7. Per-key rate limiting (`429` with `Retry-After`).
    8. Route + scope dispatch (`404` for an unknown method/path combination,
       `403` when the authenticated key lacks the endpoint's required
       scope).
    9. JSON body decoding for `POST`/`PUT` requests (`400` on malformed
       JSON; an empty body decodes to `{}` rather than failing outright —
       handlers reject a missing *required* field on their own terms with a
       field-specific `422`).
    10. Handler invocation. An expected, client-facing failure (`404`,
        `409`, `422`, etc.) is raised deliberately by the handler with a
        specific message and (optionally) an offending field name. Any
        other exception is mapped generically to `500` and never leaks its
        underlying cause to the caller.

    ### Authentication

    Every endpoint requires a valid API key, presented as **either**:

    - `Authorization: Bearer g2ml_<8-char prefix>_<43-char secret>` — the
      canonical form, checked first; **or**
    - `X-API-Key: g2ml_<8-char prefix>_<43-char secret>` — a documented
      alias, only consulted when no Bearer token was presented.

    The key format is `g2ml_` followed by an 8-character base64url prefix
    (used for an O(1) indexed lookup; carries no secrecy value), an
    underscore, and a 43-character base64url secret (256 bits of entropy).
    The full plaintext key is shown to its owner exactly once, at creation,
    and is never stored, logged, or reconstructable server-side — only a
    SHA-256 hash of the whole presented string is persisted and compared via
    a timing-safe `hash_equals()`.

    Every rejection path (unknown prefix, wrong secret, inactive key,
    expired key, suspended/inactive owning user, inactive organisation)
    returns the identical generic `401` — a caller can never distinguish
    *why* a key was rejected, which prevents prefix/secret enumeration.

    ### Scopes

    Each key carries an explicit list of scope strings (its
    `permissions`). An endpoint that requires a scope the key does not
    carry returns `403`. The scopes actually enforced by the shipped
    handlers are:

    | Scope | Grants |
    | --- | --- |
    | `account:read` | `GET /account` |
    | `org:read` | `GET /org` |
    | `urls:read` | `GET /urls`, `GET /urls/{code}` |
    | `urls:write` | `POST /urls`, `PUT /urls/{code}`, `POST /urls/bulk` |
    | `urls:delete` | `DELETE /urls/{code}` |
    | `qr:link` | Additional scope required (on top of `urls:write`) to use
      the CueRCode dynamic-QR create fields on `POST /urls` — enforced by
      the handler itself, not by the front-controller's route table. |

    `GET /ping` requires no scope — any valid, non-rate-limited key can call
    it, purely to prove authentication and the response envelope work
    end to end.

    ### Multi-tenancy (BOLA / IDOR defence)

    Every query in the `urls` and `org` handlers is scoped by the
    **authenticated key's own** `orgHandle` — never by anything the client
    supplies. A short code that exists but belongs to a different
    organisation is indistinguishable from one that does not exist at all:
    both return the exact same generic `404`, so a caller can never use
    response-shape or status differences to enumerate another tenant's
    short codes.

    ### Rate limiting and backoff

    Two independent, DB-backed windows are enforced per key (there is no
    background daemon on the Dreamhost shared-hosting target, so limits are
    computed from recent rows in the request-log table itself):

    - **Daily** — the key's own `rateLimitOverride` if set, otherwise the
      `api.default_daily_limit` setting (ships as `5000`), over a rolling
      24-hour window.
    - **Burst** — the `api.default_per_minute` setting (ships as `60`),
      over a rolling 60-second window, applied to every key regardless of
      any daily override.

    Exceeding either window returns `429` with a `Retry-After` header
    (`86400` seconds for the daily window, `60` for the burst window) and a
    plain error body — **no** `meta` block is present on an error response.

    On every **successful** response, `meta.rateLimit` reports
    `{limit, remaining, resetAt}` for the tighter of the two windows — this
    is the only place rate-limit state is exposed; no `X-RateLimit-*`
    headers are sent.

    Separately, a **pre-authentication** IP backoff runs *before* the
    Bearer/`X-API-Key` header is even parsed: once a single IP address has
    produced `api.preauth_fail_per_minute` (ships as `20`) failed-auth
    (`401`) responses within a rolling 60-second window, every further
    request from that IP receives `429` + `Retry-After: 60` *without* the
    cost of a key-verification attempt — and, because the response code is
    now `429` rather than `401`, it stops feeding the very count that
    tripped the guard.

    ### Response envelope

    Every response — success or error, and regardless of endpoint — shares
    one of exactly two shapes:

    - **Success:** `{"status": "success", "data": ..., "meta": {"timestamp",
      "requestId", "rateLimit"}}`
    - **Error:** `{"status": "error", "error": {"code", "message", "field"}}`
      (`field` is `null` unless the error is attributable to one specific
      request field.)

    ### Content negotiation (JSON / XML)

    JSON is the default and only format most integrations need. Any
    request — success or error path, any endpoint — may instead request an
    XML rendering of the identical envelope by adding `?format=xml` to the
    URL, or sending `Accept: application/xml` or `Accept: text/xml`. The
    XML document is otherwise structurally identical to the JSON body
    (each key becomes an element; arrays become repeated `<item>`
    elements).

    ### CueRCode dynamic-QR integration

    `POST /urls` accepts an additional pair of fields — `qr_external_id`
    and `qr_external_uuid` — that opt the request into linking the new
    short URL to an externally-managed QR code (CueRCode is a separate,
    first-party QR service; Go2My.Link stores only the link, never the QR
    image). Supplying *either* field makes *both* required. This path is
    gated, before any field-level validation runs, on:

    - the `cuercode.integration_enabled` operator setting (ships **off**;
      `403` when disabled), and
    - the calling key's own `qr:link` scope (`403` when absent) — this is
      *in addition to* the base `urls:write` scope the route itself
      requires.

    A `qr_external_uuid` collision with an already-linked short URL returns
    `409` with `field: "qr_external_uuid"`, distinct from a normal
    `custom_code` collision (`409` with `field: "custom_code"`).
