; Show no PHP errors on screen from the first line of a request, including
; errors PHP finds before any of our code runs (for example a file that does not
; parse). The application turns them back on for a signed-in global
; administrator only (#319, docs/decisions/D-011-debug-panel-global-admin.md).
; This file is read when PHP runs as CGI or FastCGI. Where PHP runs inside
; Apache, the .htaccess beside it does the same job.
; https://www.php.net/manual/en/configuration.file.per-user.php
display_errors = Off
display_startup_errors = Off
log_errors = On
